name: Record the Judge's voice

# Records every word, slow word, sentence and meaning with the open-source Kokoro
# voice model, and keeps the recordings in the Actions cache. The deploy workflow
# picks them up. This job has read-only access and no deploy rights.

on:
  push:
    branches: [main]
    paths:
      - 'src/data/**'
      - 'src/engine/voice.ts'
      - 'src/engine/judgeStateMachine.ts'
      - 'src/lib/voiceManifest.ts'
      - 'src/lib/praise.ts'
      - 'scripts/generate_audio.py'
      - '.github/workflows/audio.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: audio
  cancel-in-progress: false

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 200
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - name: List what needs recording
        run: npx vitest run src/lib/clips.test.ts
        env:
          AUDIO_MANIFEST_OUT: audio-manifest.json
      - name: Restore earlier recordings
        uses: actions/cache/restore@v4
        with:
          path: public/audio
          key: audio-v1-${{ hashFiles('audio-manifest.json') }}-${{ github.run_id }}
          restore-keys: |
            audio-v1-
      - name: Voice model
        uses: actions/cache@v4
        with:
          path: |
            kokoro-v1.0.onnx
            voices-v1.0.bin
          key: kokoro-model-v1.0
      - name: Download the voice model if needed
        run: |
          for f in kokoro-v1.0.onnx voices-v1.0.bin; do
            [ -s "$f" ] || curl -fsSL -o "$f" "https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/$f"
          done
          ls -la kokoro-v1.0.onnx voices-v1.0.bin
      - run: pip install "kokoro-onnx>=0.4,<0.6" soundfile
      - name: Record
        id: record
        run: python scripts/generate_audio.py audio-manifest.json public/audio 150
      - name: Keep the recordings
        if: always()
        uses: actions/cache/save@v4
        with:
          path: public/audio
          key: audio-v1-${{ hashFiles('audio-manifest.json') }}-${{ github.run_id }}
