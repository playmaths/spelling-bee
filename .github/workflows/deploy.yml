name: Test and deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Redeploy when new voice recordings are ready.
  workflow_run:
    workflows: ["Record the Judge's voice"]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Add the voice recordings, if any exist yet
        uses: actions/cache/restore@v4
        with:
          path: public/audio
          key: audio-v1-none
          restore-keys: |
            audio-v1-
      - run: rm -f public/audio/done.json && ls public/audio 2>/dev/null | head -3 || true
      - run: npx vitest run
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
